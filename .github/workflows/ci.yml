name: Check
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/codepace_test
      NEXT_TELEMETRY_DISABLED: "1"
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: codepace_test
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run db:migrate
      - run: npm run check
      - name: Check SEO, player workflows and 50-player rooms
        run: |
          npm start > /tmp/codepace.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" || true' EXIT
          for _attempt in {1..40}; do
            if curl --fail --silent http://localhost:5189 > /dev/null; then break; fi
            sleep 1
          done
          npm run test:seo
          npm run test:ui
          npm run test:rooms
          npm run test:schedules
          npm run test:leetcode
          npm run test:load
      - name: Upload server log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: server-log
          path: /tmp/codepace.log
